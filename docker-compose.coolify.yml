version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-8008}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:8000}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - PUBLIC_API_URL=${PUBLIC_API_URL:-https://100k-api.rycos.eu}
      - RYCOS_MQTT_HOST=${RYCOS_MQTT_HOST:-rycos.eu}
      - RYCOS_MQTT_PORT=${RYCOS_MQTT_PORT:-8883}
      - RYCOS_MQTT_USERNAME=${RYCOS_MQTT_USERNAME}
      - RYCOS_MQTT_PASSWORD=${RYCOS_MQTT_PASSWORD}
      - RYCOS_DEFAULT_DISPLAY_ID=${RYCOS_DEFAULT_DISPLAY_ID}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - coolify
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - RYCOS_MQTT_HOST=${RYCOS_MQTT_HOST:-rycos.eu}
      - RYCOS_MQTT_PORT=${RYCOS_MQTT_PORT:-8883}
      - RYCOS_MQTT_USERNAME=${RYCOS_MQTT_USERNAME}
      - RYCOS_MQTT_PASSWORD=${RYCOS_MQTT_PASSWORD}
      - RYCOS_DEFAULT_DISPLAY_ID=${RYCOS_DEFAULT_DISPLAY_ID}
    networks:
      - coolify
    extra_hosts:
      - "host.docker.internal:host-gateway"

  customer-web:
    build:
      context: .
      dockerfile: apps/customer-web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://100k-api.rycos.eu}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-wss://100k-api.rycos.eu/v1/ws}
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://100k-api.rycos.eu}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-wss://100k-api.rycos.eu/v1/ws}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - coolify

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-http://57.128.250.200:8000}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.dummy}
        - ADMIN_API_URL=${ADMIN_API_URL:-https://100k-api.rycos.eu/v1/admin}
        - NEXT_PUBLIC_ORDER_BASE_URL=${NEXT_PUBLIC_ORDER_BASE_URL:-https://100k.rycos.eu}
    restart: unless-stopped
    ports:
      - "${ADMIN_HOST_PORT:-9505}:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-http://57.128.250.200:8000}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.dummy}
      - ADMIN_API_URL=${ADMIN_API_URL:-https://100k-api.rycos.eu/v1/admin}
      - NEXT_PUBLIC_ORDER_BASE_URL=${NEXT_PUBLIC_ORDER_BASE_URL:-https://100k.rycos.eu}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - coolify

networks:
  coolify:
    external: true
