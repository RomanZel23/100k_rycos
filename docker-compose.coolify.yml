version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-8008}:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET is required}
      - TERMINAL_TOKEN_SECRET=${TERMINAL_TOKEN_SECRET:-}
      - PLATFORM_ADMIN_PASSWORD=${PLATFORM_ADMIN_PASSWORD:-}
      - PENDING_PAYMENT_TTL_MINUTES=${PENDING_PAYMENT_TTL_MINUTES:-30}
      - PUBLIC_CUSTOMER_URL=${PUBLIC_CUSTOMER_URL:-https://100k.rycos.eu}
      - PUBLIC_ADMIN_URL=${PUBLIC_ADMIN_URL:-https://100k-admin.rycos.eu}
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:8000}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - PUBLIC_API_URL=${PUBLIC_API_URL:-https://100k-api.rycos.eu}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - RYCOS_MQTT_HOST=${RYCOS_MQTT_HOST:-rycos.eu}
      - RYCOS_MQTT_PORT=${RYCOS_MQTT_PORT:-8883}
      - RYCOS_MQTT_USERNAME=${RYCOS_MQTT_USERNAME}
      - RYCOS_MQTT_PASSWORD=${RYCOS_MQTT_PASSWORD}
      - RYCOS_DEFAULT_DISPLAY_ID=${RYCOS_DEFAULT_DISPLAY_ID}
      - RYCOS_DISPLAY_ID=${RYCOS_DEFAULT_DISPLAY_ID}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-no-reply@receipts.rycos.eu}
      - GUS_USER_KEY=${GUS_USER_KEY:-}
      - GUS_TEST_MODE=${GUS_TEST_MODE:-}
      - SAFERPAY_CUSTOMER_ID=${SAFERPAY_CUSTOMER_ID:-278134}
      - SAFERPAY_TERMINAL_ID=${SAFERPAY_TERMINAL_ID:-17770989}
      - SAFERPAY_API_USERNAME=${SAFERPAY_API_USERNAME:-API_278134_98615439}
      - SAFERPAY_API_PASSWORD=${SAFERPAY_API_PASSWORD:-}
      - SAFERPAY_TEST_MODE=${SAFERPAY_TEST_MODE:-true}
      - SOLUTIONSBAY_SAFERPAY_CUSTOMER_ID=${SOLUTIONSBAY_SAFERPAY_CUSTOMER_ID:-}
      - SOLUTIONSBAY_SAFERPAY_TERMINAL_ID=${SOLUTIONSBAY_SAFERPAY_TERMINAL_ID:-}
      - SOLUTIONSBAY_SAFERPAY_API_USERNAME=${SOLUTIONSBAY_SAFERPAY_API_USERNAME:-}
      - SOLUTIONSBAY_SAFERPAY_API_PASSWORD=${SOLUTIONSBAY_SAFERPAY_API_PASSWORD:-}
      - SOLUTIONSBAY_SAFERPAY_TEST_MODE=${SOLUTIONSBAY_SAFERPAY_TEST_MODE:-true}
      - RYCOS_PORTAL_URL=${RYCOS_PORTAL_URL:-https://portal.rycos.eu}
      - RYCOS_INTEGRATOR_KEY=${RYCOS_INTEGRATOR_KEY:-}
      - RYCOS_SOLUTION_TOKEN=${RYCOS_SOLUTION_TOKEN:-}
      - RYCOS_LICENSE_TOKEN=${RYCOS_LICENSE_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - coolify
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - RYCOS_MQTT_HOST=${RYCOS_MQTT_HOST:-rycos.eu}
      - RYCOS_MQTT_PORT=${RYCOS_MQTT_PORT:-8883}
      - RYCOS_MQTT_USERNAME=${RYCOS_MQTT_USERNAME}
      - RYCOS_MQTT_PASSWORD=${RYCOS_MQTT_PASSWORD}
      - RYCOS_DEFAULT_DISPLAY_ID=${RYCOS_DEFAULT_DISPLAY_ID}
    networks:
      - coolify
    extra_hosts:
      - "host.docker.internal:host-gateway"

  customer-web:
    build:
      context: .
      dockerfile: apps/customer-web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://100k-api.rycos.eu}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-wss://100k-api.rycos.eu/v1/ws}
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://100k-api.rycos.eu}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-wss://100k-api.rycos.eu/v1/ws}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - coolify

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-http://57.128.250.200:8000}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.dummy}
        - ADMIN_API_URL=${ADMIN_API_URL:-https://100k-api.rycos.eu/v1/admin}
        - NEXT_PUBLIC_ORDER_BASE_URL=${NEXT_PUBLIC_ORDER_BASE_URL:-https://100k.rycos.eu}
    restart: unless-stopped
    ports:
      - "${ADMIN_HOST_PORT:-9505}:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-http://57.128.250.200:8000}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.dummy}
      - ADMIN_API_URL=${ADMIN_API_URL:-https://100k-api.rycos.eu/v1/admin}
      - NEXT_PUBLIC_ORDER_BASE_URL=${NEXT_PUBLIC_ORDER_BASE_URL:-https://100k.rycos.eu}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - coolify

networks:
  coolify:
    external: true
